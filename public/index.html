<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Miraw — One AI, Many Roles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07060c;
    --bg-1:#0d0b17;
    --glass:rgba(20,17,32,0.55);
    --glass-border:rgba(255,255,255,0.08);
    --violet-1:#7c3aed;
    --violet-2:#a855f7;
    --text-hi:#f3f1fb;
    --text-lo:#9c96b3;

    /* role accent — swapped via body[data-role] */
    --accent-1:#8b5cf6;
    --accent-2:#c026d3;
    --accent-glow:rgba(139,92,246,0.35);
  }

  body[data-role="gf"]{
    --accent-1:#fb7185;
    --accent-2:#c026d3;
    --accent-glow:rgba(251,113,133,0.35);
  }
  body[data-role="roast"]{
    --accent-1:#f97316;
    --accent-2:#ef4444;
    --accent-glow:rgba(249,115,22,0.32);
  }
  body[data-role="beti"]{
    --accent-1:#fbbf24;
    --accent-2:#f472b6;
    --accent-glow:rgba(251,191,36,0.32);
  }
  body[data-role="secretary"]{
    --accent-1:#38bdf8;
    --accent-2:#6366f1;
    --accent-glow:rgba(56,189,248,0.32);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    font-family:'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(124,58,237,0.18), transparent 40%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 60%, var(--bg-0));
    color:var(--text-hi);
    min-height:100vh;
    display:flex;
    justify-content:center;
    transition:background 0.6s ease;
  }

  .app-shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    padding:22px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }

  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    background:linear-gradient(120deg, var(--text-hi), var(--accent-1));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    transition:background 0.6s ease;
  }

  .tagline{
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-lo);
    text-transform:uppercase;
    margin-top:2px;
  }

  .role-pill{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    width:fit-content;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 8px 24px -12px var(--accent-glow);
    transition:box-shadow 0.6s ease;
  }

  .role-dot{
    width:8px; height:8px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow:0 0 10px var(--accent-glow);
    flex-shrink:0;
  }

  .role-pill span{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--text-hi);
  }

  /* ---------- Chat area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:8px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .msg-row{
    display:flex;
    max-width:88%;
  }
  .msg-row.user{ align-self:flex-end; }
  .msg-row.ai{ align-self:flex-start; }

  .bubble{
    padding:11px 15px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .msg-row.user .bubble{
    background:linear-gradient(135deg, var(--violet-1), var(--violet-2));
    border-bottom-right-radius:4px;
    color:#fff;
  }

  .msg-row.ai .bubble{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom-left-radius:4px;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02) inset;
  }

  .msg-row.ai .bubble::before{
    content:attr(data-role-label);
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-1);
    margin-bottom:4px;
    opacity:0.85;
  }

  /* ---------- Command cards (Alexa / Alarm / Reminder) ---------- */
  .card{
    align-self:flex-start;
    max-width:88%;
    border-radius:14px;
    padding:13px 16px;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 8px 30px -16px var(--accent-glow);
  }

  .card-icon{
    width:36px; height:36px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    flex-shrink:0;
  }
  .card-icon svg{ width:18px; height:18px; stroke:#0a0a0f; }

  .card-body{ display:flex; flex-direction:column; gap:2px; }
  .card-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-1);
  }
  .card-main{ font-size:14px; font-weight:600; color:var(--text-hi); }
  .card-sub{ font-size:12px; color:var(--text-lo); font-family:'IBM Plex Mono', monospace; }

  /* ---------- Typing indicator ---------- */
  .typing{
    display:flex; gap:4px; padding:12px 15px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; border-bottom-left-radius:4px;
    width:fit-content;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent-1);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  /* ---------- Input bar ---------- */
  .input-bar{
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.35) 30%);
  }

  .input-wrap{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:22px;
    padding:6px 6px 6px 16px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .input-wrap input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-hi);
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    padding:8px 4px;
  }
  .input-wrap input::placeholder{ color:var(--text-lo); }

  .icon-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.15s ease, box-shadow 0.3s ease;
  }
  .icon-btn:active{ transform:scale(0.92); }

  .mic-btn{
    background:rgba(255,255,255,0.06);
    color:var(--text-lo);
  }
  .mic-btn.listening{
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#0a0a0f;
    box-shadow:0 0 18px var(--accent-glow);
  }

  .send-btn{
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#0a0a0f;
    box-shadow:0 4px 20px -6px var(--accent-glow);
  }
  .send-btn svg, .mic-btn svg{ width:17px; height:17px; }

  /* ---------- Bottom tabs ---------- */
  nav.tabs{
    display:flex;
    border-top:1px solid var(--glass-border);
    background:rgba(7,6,12,0.75);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  nav.tabs button{
    flex:1;
    padding:13px 0 calc(10px + env(safe-area-inset-bottom));
    background:none;
    border:none;
    color:var(--text-lo);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
  }
  nav.tabs button.active{ color:var(--text-hi); }
  nav.tabs button.active::before{
    content:"";
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:26px; height:2px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-radius:2px;
  }

  /* ---------- Reminders view ---------- */
  #reminders-view{
    flex:1;
    overflow-y:auto;
    padding:14px 16px;
    display:none;
    flex-direction:column;
    gap:10px;
  }
  #reminders-view.visible{ display:flex; }
  main.hidden{ display:none; }

  .empty-state{
    margin-top:60px;
    text-align:center;
    color:var(--text-lo);
    font-size:13px;
    font-family:'IBM Plex Mono', monospace;
  }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>
<body data-role="roast">
<div class="app-shell">

  <header>
    <div class="brand-row">
      <div>
        <div class="brand">Miraw</div>
        <div class="tagline">One AI, Many Roles</div>
      </div>
    </div>
    <div class="role-pill">
      <div class="role-dot"></div>
      <span id="role-label">Roast Mode</span>
    </div>
  </header>

  <main id="chat-view"></main>

  <div id="reminders-view"></div>

  <div class="input-bar" id="input-bar">
    <div class="input-wrap">
      <input id="msg-input" type="text" placeholder="Type kar ya bol de..." autocomplete="off" />
    </div>
    <button class="icon-btn mic-btn" id="mic-btn" title="Voice input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="icon-btn send-btn" id="send-btn" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <nav class="tabs">
    <button class="active" data-tab="chat">Chat</button>
    <button data-tab="reminders">Reminders</button>
  </nav>

</div>

<script>
  const ROLE_LABELS = {
    gf: "Girlfriend",
    roast: "Roast Mode",
    beti: "Daughter",
    secretary: "Secretary"
  };

  const chatView = document.getElementById('chat-view');
  const remindersView = document.getElementById('reminders-view');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const inputBar = document.getElementById('input-bar');
  const roleLabelEl = document.getElementById('role-label');
  const tabs = document.querySelectorAll('nav.tabs button');

  let currentTab = 'chat';

  function setRole(role){
    document.body.setAttribute('data-role', role);
    roleLabelEl.textContent = ROLE_LABELS[role] || role;
  }

  function scrollToBottom(){
    chatView.scrollTop = chatView.scrollHeight;
  }

  function addUserBubble(text){
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatView.appendChild(row);
    scrollToBottom();
  }

  function addAiBubble(text, roleLabel){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.setAttribute('data-role-label', roleLabel);
    bubble.textContent = text;
    row.appendChild(bubble);
    chatView.appendChild(row);
    scrollToBottom();
  }

  function addTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';
    row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chatView.appendChild(row);
    scrollToBottom();
    return row;
  }

  function bulbIconSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.5.4.8 1 .8 1.6v.7h6.4v-.7c0-.6.3-1.2.8-1.6A7 7 0 0 0 12 2z"/></svg>';
  }
  function alarmIconSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M5 3 2 6"/><path d="M22 6l-3-3"/></svg>';
  }

  function addCommandCard(intent, data){
    const card = document.createElement('div');
    card.className = 'card';

    let icon, title, main, sub;
    if (intent === 'ALEXA_COMMAND') {
      icon = bulbIconSvg();
      title = 'Alexa Command';
      main = (data.device || 'device').replace(/\b\w/g, c => c.toUpperCase());
      sub = 'Action: ' + (data.action || '').toUpperCase();
    } else if (intent === 'ALARM_SET') {
      icon = alarmIconSvg();
      title = 'Alarm Set';
      main = data.time ? data.time : 'Time noted';
      sub = data.text || '';
    } else {
      icon = alarmIconSvg();
      title = 'Reminder Set';
      main = data.time ? data.time : 'Reminder saved';
      sub = data.text || '';
    }

    card.innerHTML = `
      <div class="card-icon">${icon}</div>
      <div class="card-body">
        <div class="card-title">${title}</div>
        <div class="card-main">${main}</div>
        ${sub ? `<div class="card-sub">${sub}</div>` : ''}
      </div>
    `;
    chatView.appendChild(card);
    scrollToBottom();
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if (!text) return;
    msgInput.value = '';
    addUserBubble(text);
    const typingRow = addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingRow.remove();

      if (!res.ok) {
        addAiBubble(data.error || 'Kuch gadbad ho gayi.', 'System');
        return;
      }

      setRole(data.role);
      addAiBubble(data.reply, data.roleLabel || ROLE_LABELS[data.role]);

      if (data.intent === 'ALEXA_COMMAND' || data.intent === 'ALARM_SET' || data.intent === 'REMINDER_SET') {
        addCommandCard(data.intent, data.data || {});
      }
    } catch (err) {
      typingRow.remove();
      addAiBubble('Connection issue aa gaya, dobara try kar.', 'System');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ---- Web Speech API mic ----
  let recognition = null;
  let listening = false;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      msgInput.value = transcript;
      sendMessage();
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
    };
    recognition.onerror = () => {
      listening = false;
      micBtn.classList.remove('listening');
    };
  } else {
    micBtn.style.opacity = '0.35';
    micBtn.title = 'Voice input not supported in this browser';
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (listening) {
      recognition.stop();
      return;
    }
    listening = true;
    micBtn.classList.add('listening');
    recognition.start();
  });

  // ---- Tabs ----
  async function loadReminders(){
    remindersView.innerHTML = '';
    try {
      const res = await fetch('/reminders');
      const data = await res.json();
      const items = [...(data.reminders || [])].reverse();
      const alexaItems = [...(data.alexaLog || [])].reverse();

      if (items.length === 0 && alexaItems.length === 0) {
        remindersView.innerHTML = '<div class="empty-state">Koi alarm, reminder ya command abhi tak nahi hai.</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon">${alarmIconSvg()}</div>
          <div class="card-body">
            <div class="card-title">${item.type === 'alarm' ? 'Alarm' : 'Reminder'}</div>
            <div class="card-main">${item.time || 'No time specified'}</div>
            <div class="card-sub">${item.text}</div>
          </div>
        `;
        remindersView.appendChild(card);
      });

      alexaItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon">${bulbIconSvg()}</div>
          <div class="card-body">
            <div class="card-title">Smart Home</div>
            <div class="card-main">${item.device}</div>
            <div class="card-sub">Action: ${item.action.toUpperCase()}</div>
          </div>
        `;
        remindersView.appendChild(card);
      });
    } catch (err) {
      remindersView.innerHTML = '<div class="empty-state">Reminders load nahi ho paaye.</div>';
    }
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-tab');

      if (currentTab === 'reminders') {
        chatView.classList.add('hidden');
        remindersView.classList.add('visible');
        inputBar.style.display = 'none';
        loadReminders();
      } else {
        chatView.classList.remove('hidden');
        remindersView.classList.remove('visible');
        inputBar.style.display = 'flex';
      }
    });
  });

  // ---- Welcome message ----
  addAiBubble(
    "Bol bhai kya chahiye — gf mode, roast, beti feeling ya secretary kaam. Bata kya scene hai.",
    "Roast Mode"
  );
</script>
</body>
</html>
